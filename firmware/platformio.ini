; RFNETHM firmware — USB-Host-Bringup auf ESP32-S3-WROOM-1 (YD-ESP32-S3 V1.4).
;
; v0.1: Enumeration-Probe für den HmIP-RFUSB-Stick am OTG-Port (USB2).
; Console läuft auf UART0 → CH343P-Bridge → ttyACM2 auf dem Pi5.
;
; Flashing: USB1 (CH343P) ist der Programmierport.  USB2 ist für den
; nativen USB-Host-PHY reserviert (Stick).  Auto-Reset/Auto-Bootload
; via DTR/RTS ist verifiziert (siehe docs/usb_host_verification.md).

[platformio]
; Build-Output auf lokales ext4 (/root) statt NFS (/Public).  NFS-Sync-
; Semantik bei `Archive` → `Index (ranlib)` ist im Default nicht atomic
; genug; mehrere Builds 2026-05-07 sind an "file format not recognized"
; gestorben weil ranlib die libX.a vor dem flush gelesen hat.  Außerdem
; trifft es version.h beim atomic-write (truncate-without-fsync).
build_dir = /root/pio-build/rfnethm-build

[env:rfnethm]
; espressif32@6.13.0 == IDF 5.5.x (= aktueller usb_host_lib).  Pin gesetzt
; weil mehrere Versionen lokal gecached sind (6.5.0 / 6.9.0 / 6.13.0 /
; pioarduino-51.x) und der Default zwischen Maschinen abweicht.
platform   = espressif32@6.13.0
board      = esp32-s3-devkitc-1
framework  = espidf

monitor_speed = 115200
upload_port  = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C37278755-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C37278755-if00
upload_speed = 921600

board_build.flash_size  = 16MB
board_upload.flash_size = 16MB

; v0.9: custom partition layout — two 3 MB OTA slots, no factory
; partition.  First boot lives in ota_0 (`esp_ota_get_running_partition`
; returns it on a fresh flash).  See partitions_ota.csv for details.
board_build.partitions = partitions_ota.csv

; Pre-build hook: snapshot working tree to git (in repo root,
; /Public/CLAUDE/RFNETHM), bump build_number.txt, regenerate
; src/version.h with current MAJOR.MINOR.BUILD + timestamp.
extra_scripts = pre:scripts/version_bump.py

; Optional VBUS-switch override.  YD-ESP32-S3 V1.4 has no active switch;
; leave VBUS_GPIO=-1.  Boards with a TPS2065/SY6280-style switch should
; set the GPIO and (if needed) the active polarity here.
;build_flags =
;    -D VBUS_GPIO=12
;    -D VBUS_ACTIVE_HIGH=1
